[package]
name = "rpc-manifest"
description = "Types and lookups for RPC manifests from protoc-gen-rpc-manifest, and a generic Connect JSON caller."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Serialize manifests (e.g. to print them as JSON).
serde = ["dep:serde"]
# A generic Connect unary JSON caller over reqwest (no TLS).
connect = ["dep:reqwest", "dep:serde_json", "dep:serde", "dep:http", "dep:bytes"]
# `connect` plus rustls for `https://` base URLs.
tls = ["connect", "reqwest/rustls"]
miette = ["dep:miette", "miette/derive"]

[dependencies]
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
miette = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "connect"
required-features = ["connect"]
