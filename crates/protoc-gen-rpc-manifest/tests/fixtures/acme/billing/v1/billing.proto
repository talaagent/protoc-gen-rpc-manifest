syntax = "proto3";

package acme.billing.v1;

import "acme/common/v1/common.proto";

/* Block comments work too. */
service HTTPInvoiceService {
  // Uploads invoice lines in chunks.
  rpc UploadLines(stream Line) returns (acme.common.v1.Empty);

  // Syncs lines both ways.
  rpc SyncLines(stream Line) returns (stream Line);
}

message Line {
  string sku = 1;
  int64 cents = 2;
}
