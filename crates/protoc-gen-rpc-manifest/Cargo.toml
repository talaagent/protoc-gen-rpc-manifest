[package]
name = "protoc-gen-rpc-manifest"
description = "protoc/buf plugin that emits a manifest of every RPC service and method (Rust, TypeScript or JSON)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/protoc-gen-rpc-manifest"
keywords = ["protobuf", "protoc", "buf", "connectrpc", "codegen"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "protoc-gen-rpc-manifest"
path = "src/main.rs"

[dependencies]
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true

[lints]
workspace = true
