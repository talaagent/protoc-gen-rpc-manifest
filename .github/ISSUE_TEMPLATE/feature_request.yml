name: Feature request
description: Suggest an option, output, API or documentation improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do with the manifest or the `rpc` subcommand, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example of the plugin option, generated output, Rust API or command line you want, and any alternatives you considered.
    validations:
      required: true
